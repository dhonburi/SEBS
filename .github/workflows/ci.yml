name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    # SEBS.App is a WinForms project, so the solution only builds on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SEBS.slnx

      - name: Build
        run: dotnet build SEBS.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test SEBS.Tests/SEBS.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "Code Coverage;Format=cobertura"
          --results-directory TestResults

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/*.cobertura.xml" -targetdir:CoverageReport -reporttypes:"Html;MarkdownSummaryGithub;JsonSummary" -assemblyfilters:"-SEBS.Tests"
          Get-Content CoverageReport/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      # Quality gate: fail the build if line coverage of Core + Services drops below 80%
      - name: Check coverage threshold
        run: |
          $summary = Get-Content CoverageReport/Summary.json | ConvertFrom-Json
          $coverage = $summary.summary.linecoverage
          Write-Host "Line coverage (Core + Services): $coverage%"
          if ($coverage -lt 80) {
            Write-Error "Line coverage $coverage% is below the 80% threshold"
            exit 1
          }

      - name: Upload test results and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            TestResults
            CoverageReport
